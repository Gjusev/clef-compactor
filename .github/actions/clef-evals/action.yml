name: "clef-evals regression gate"
description: >-
  Fail the build when compaction quality regresses: compare a fresh
  measurement JSON against a committed baseline. Pure Python, no network and
  no credentials at gate time (the measurement itself is produced by your own
  run step, e.g. evals/run_eval.py).
inputs:
  current:
    description: "Path to the fresh measurement JSON"
    required: true
  baseline:
    description: "Path to the committed baseline JSON"
    required: true
  metrics:
    description: >-
      Metric specs, one per line: path:goal[:tolerance]. path is a dotted path
      into the JSON, goal is max (accuracy-like: current must not drop below
      baseline minus tolerance) or min (error-like: current must not rise
      above baseline plus tolerance). tolerance defaults to 0.02.
    required: true
runs:
  using: "composite"
  steps:
    - name: Check quality metrics against the baseline
      shell: bash
      env:
        METRICS: ${{ inputs.metrics }}
        CURRENT: ${{ inputs.current }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        ARGS=()
        while IFS= read -r spec; do
          spec="${spec%$'\r'}"   # tolerate CRLF from workflow editors
          [ -n "$spec" ] && ARGS+=(--metric "$spec")
        done <<< "$METRICS"
        python3 "${{ github.action_path }}/check_regression.py" \
          --current "$CURRENT" \
          --baseline "$BASELINE" \
          "${ARGS[@]}"
