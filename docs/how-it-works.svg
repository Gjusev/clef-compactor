<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">How clef-compactor filters retrieval context</title>
  <desc id="description">Retrieved documents are scored by Cloudflare Clef against a query. Relevant documents form a smaller context while irrelevant and over-budget documents are retained as auditable cuts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#262620" flood-opacity="0.08" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#262620" flood-opacity="0.08" />
    </filter>
    <linearGradient id="gateGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="1" stop-color="#dfe8dc" stop-opacity="0.82" />
    </linearGradient>
    <linearGradient id="keepFlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88a789" stop-opacity="0.2" />
      <stop offset="1" stop-color="#4e7a51" stop-opacity="0.85" />
    </linearGradient>
    <pattern id="gateMesh" width="11" height="11" patternUnits="userSpaceOnUse">
      <circle cx="5.5" cy="5.5" r="1.65" fill="#618165" fill-opacity="0.62" />
    </pattern>
    <marker id="arrowKeep" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4e7a51" />
    </marker>
    <marker id="arrowCut" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#bd625b" />
    </marker>
    <style>
      .canvas { fill: #f7f6f3; }
      .ink { fill: #1a1a18; }
      .body { fill: #54544f; }
      .muted { fill: #7c7b76; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.35px; }
      .headline { font-size: 35px; font-weight: 600; letter-spacing: -0.55px; }
      .subhead { font-size: 16px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
      .chip { font-size: 13px; font-weight: 600; }
      .doc { font-size: 14px; }
      .metric { font-size: 12px; font-weight: 700; letter-spacing: 0.6px; }
      .flow { stroke-dasharray: 8 8; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
    </style>
  </defs>

  <rect class="canvas" width="1200" height="700" rx="24" />

  <!-- Header -->
  <text class="mono eyebrow muted" x="76" y="72">CLEF-COMPACTOR / CONTEXT COMPACTION</text>
  <text class="serif headline ink" x="76" y="119">A relevance gate for retrieved context.</text>
  <text class="body subhead" x="76" y="150">Score evidence against the question, keep what fits, and explain every cut.</text>
  <g transform="translate(902 54)">
    <rect width="222" height="38" rx="19" fill="#edf3ec" stroke="#dce8da" />
    <circle cx="22" cy="19" r="5" fill="#4e7a51" />
    <text class="mono metric" x="38" y="23" fill="#38613b">1 CALL · UP TO 64 CHUNKS</text>
  </g>
  <line x1="76" y1="181" x2="1124" y2="181" stroke="#e4e2dc" />

  <!-- Source side -->
  <text class="mono label muted" x="76" y="222">01 / RETRIEVAL BATCH</text>
  <g filter="url(#softShadow)">
    <rect x="76" y="241" width="322" height="48" rx="11" fill="#ffffff" stroke="#e6e4de" />
    <circle cx="100" cy="265" r="7" fill="#1f6c9f" />
    <text class="mono chip ink" x="119" y="270">query: refund policy</text>
  </g>

  <!-- Retrieved chunks -->
  <g filter="url(#softShadow)">
    <rect x="76" y="316" width="322" height="47" rx="10" fill="#edf3ec" stroke="#dce8da" />
    <rect x="76" y="371" width="322" height="47" rx="10" fill="#fceced" stroke="#f0d8d8" />
    <rect x="76" y="426" width="322" height="47" rx="10" fill="#edf3ec" stroke="#dce8da" />
    <rect x="76" y="481" width="322" height="47" rx="10" fill="#fbf3db" stroke="#f0e3bf" />
    <rect x="76" y="536" width="322" height="47" rx="10" fill="#edf3ec" stroke="#dce8da" />
  </g>
  <text class="mono chip" x="94" y="345" fill="#38613b">doc 01</text>
  <text class="mono doc muted" x="164" y="345">returns within 30 days</text>
  <text class="mono chip" x="94" y="400" fill="#a43f3a">doc 02</text>
  <text class="mono doc muted" x="164" y="400">the Eiffel Tower is in Paris</text>
  <text class="mono chip" x="94" y="455" fill="#38613b">doc 03</text>
  <text class="mono doc muted" x="164" y="455">refund to original payment method</text>
  <text class="mono chip" x="94" y="510" fill="#956400">doc 04</text>
  <text class="mono doc muted" x="164" y="510">office hours and contact details</text>
  <text class="mono chip" x="94" y="565" fill="#38613b">doc 05</text>
  <text class="mono doc muted" x="164" y="565">email support starts a refund</text>

  <!-- Flow into the gate -->
  <path class="flow" d="M410 339 H450" fill="none" stroke="#4e7a51" stroke-width="2" marker-end="url(#arrowKeep)" />
  <path class="flow" d="M410 394 H450" fill="none" stroke="#bd625b" stroke-width="2" marker-end="url(#arrowCut)" />
  <path class="flow" d="M410 449 H450" fill="none" stroke="#4e7a51" stroke-width="2" marker-end="url(#arrowKeep)" />
  <path class="flow" d="M410 504 H450" fill="none" stroke="#b78719" stroke-width="2" marker-end="url(#arrowCut)" />
  <path class="flow" d="M410 559 H450" fill="none" stroke="#4e7a51" stroke-width="2" marker-end="url(#arrowKeep)" />

  <!-- Clef decision gate -->
  <text class="mono label muted" x="434" y="222">02 / CLEF</text>
  <g filter="url(#shadow)">
    <rect x="452" y="269" width="100" height="330" rx="20" fill="url(#gateGlass)" stroke="#bdcdbb" stroke-width="2" />
    <rect x="468" y="287" width="68" height="294" rx="12" fill="url(#gateMesh)" />
    <rect x="477" y="302" width="50" height="22" rx="11" fill="#1a1a18" />
    <text class="mono metric" x="502" y="317" text-anchor="middle" fill="#f7f6f3">SCORE</text>
    <line x1="502" y1="339" x2="502" y2="549" stroke="#618165" stroke-width="2" stroke-dasharray="3 5" />
  </g>
  <text class="mono metric" x="502" y="621" text-anchor="middle" fill="#5d7b60">P(RELEVANT)</text>

  <!-- Result side -->
  <text class="mono label muted" x="588" y="222">03 / COMPACT RESULT</text>
  <g transform="translate(877 197)">
    <rect width="247" height="38" rx="19" fill="#edf3ec" stroke="#dce8da" />
    <text class="mono metric" x="123.5" y="24" text-anchor="middle" fill="#38613b">1,024 → 676 TOKENS · −34%</text>
  </g>

  <!-- Kept context container -->
  <g filter="url(#softShadow)">
    <rect x="588" y="258" width="536" height="231" rx="18" fill="#ffffff" stroke="#dce8da" />
  </g>
  <rect x="610" y="280" width="154" height="26" rx="13" fill="#edf3ec" />
  <text class="mono metric" x="687" y="298" text-anchor="middle" fill="#38613b">KEPT · 3 CHUNKS</text>
  <text class="mono metric muted" x="1101" y="298" text-anchor="end">VERBATIM TEXT</text>
  <line x1="610" y1="323" x2="1102" y2="323" stroke="#e8eee6" />

  <rect x="610" y="342" width="492" height="38" rx="9" fill="#edf3ec" />
  <rect x="610" y="392" width="492" height="38" rx="9" fill="#edf3ec" />
  <rect x="610" y="442" width="492" height="27" rx="9" fill="#edf3ec" />
  <text class="mono chip" x="628" y="366" fill="#38613b">01</text>
  <text class="mono doc" x="672" y="366" fill="#444640">Returns are accepted within 30 days of purchase.</text>
  <text class="mono chip" x="628" y="416" fill="#38613b">03</text>
  <text class="mono doc" x="672" y="416" fill="#444640">Refunds return to the original payment method.</text>
  <text class="mono chip" x="628" y="461" fill="#38613b">05</text>
  <text class="mono doc" x="672" y="461" fill="#444640">Email support to begin a refund request.</text>

  <!-- Result flows -->
  <path class="flow" d="M553 340 C565 340 570 361 586 361" fill="none" stroke="url(#keepFlow)" stroke-width="3" marker-end="url(#arrowKeep)" />
  <path class="flow" d="M553 447 C566 447 572 411 586 411" fill="none" stroke="url(#keepFlow)" stroke-width="3" marker-end="url(#arrowKeep)" />
  <path class="flow" d="M553 557 C566 557 573 455 586 455" fill="none" stroke="url(#keepFlow)" stroke-width="3" marker-end="url(#arrowKeep)" />

  <!-- Auditable cut cards -->
  <g filter="url(#softShadow)">
    <rect x="588" y="514" width="260" height="69" rx="14" fill="#fceced" stroke="#f0d8d8" />
    <rect x="864" y="514" width="260" height="69" rx="14" fill="#fbf3db" stroke="#f0e3bf" />
  </g>
  <text class="mono metric" x="610" y="541" fill="#a43f3a">02 · CUT</text>
  <text class="mono chip" x="610" y="563" fill="#a43f3a">irrelevant · P=0.05</text>
  <text class="mono metric" x="886" y="541" fill="#956400">04 · CUT</text>
  <text class="mono chip" x="886" y="563" fill="#956400">budget_exhausted · P=0.42</text>
  <path class="flow" d="M553 395 C565 395 572 548 586 548" fill="none" stroke="#bd625b" stroke-width="2" marker-end="url(#arrowCut)" />
  <path class="flow" d="M553 505 C642 505 751 548 862 548" fill="none" stroke="#b78719" stroke-width="2" marker-end="url(#arrowCut)" />

  <text class="mono metric muted" x="76" y="655">SCORES · TOKEN COUNTS · LATENCY · USAGE · COST ESTIMATE</text>
  <text class="mono metric" x="1124" y="655" text-anchor="end" fill="#38613b">AUDITABLE BY DESIGN</text>
</svg>
