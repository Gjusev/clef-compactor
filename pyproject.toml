[project]
name = "clef-compactor"
version = "0.2.1"
description = "Query-aware RAG context compaction using Cloudflare's Clef. Keep the evidence, cut the noise."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Youssef Ouhaghi Ahmian" }]
keywords = ["rag", "context", "compaction", "clef", "cloudflare", "llm", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25", "tiktoken>=0.7"]

[project.scripts]
clef-compact = "clef_compactor.cli:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
integrations = ["clef-compactor[langchain]", "clef-compactor[llamaindex]"]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "clef-compactor[langchain]",
]

[project.urls]
Homepage = "https://github.com/Gjusev/clef-compactor"
Repository = "https://github.com/Gjusev/clef-compactor"
Issues = "https://github.com/Gjusev/clef-compactor/issues"
Changelog = "https://github.com/Gjusev/clef-compactor/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clef_compactor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-m "not integration" --cov=clef_compactor --cov-report=term-missing --strict-markers'
markers = [
    "integration: tests that call the real Cloudflare API (deselected by default; run with -m integration and CLEF_* env vars)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["clef_compactor"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
