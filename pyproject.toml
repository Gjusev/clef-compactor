[project]
name = "clef-compactor"
version = "0.1.0"
description = "Query-aware RAG context compaction using Cloudflare's Clef. Keep the evidence, cut the noise."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Youssef Ouhaghi Ahmian" }]
keywords = ["rag", "context", "compaction", "clef", "cloudflare", "llm", "tokens"]
dependencies = ["httpx>=0.25", "tiktoken>=0.7"]

[project.scripts]
clef-compact = "clef_compactor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clef_compactor"]
